name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: |
          unzip -q JesterWifi.zip
          cd JesterWifi
          chmod +x gradlew
          ./gradlew assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JesterWifi-apk
          path: JesterWifi/app/build/outputs/apk/fdroid/debug/*.apk
